layout: page
title: Accueil
---

<style>
  /* Masquer le titre "Accueil" par défaut de la page */
  h1[data-toc-skip] { display: none !important; }

  /* Élargir la zone de contenu POUR CETTE PAGE : la colonne prend toute la
     place à droite de la barre latérale (on retire la largeur max de Chirpy) */
  #main-wrapper .container { max-width: none !important; }
  #main-wrapper main {
    max-width: 100% !important;
    flex: 0 0 100% !important;
  }
  /* On supprime le padding du contenu autour de la bannière pour qu'elle touche
     les bords de la zone (haut, gauche, droite) */
  #main-wrapper main { overflow-x: clip; }

  .hero-opossum {
    position: relative;
    margin: -1.5rem -1.6rem 2rem;   /* annule le padding du contenu -> touche les bords */
    min-height: 84vh;
    overflow: hidden;
    background: url('{{ '/assets/img/banner.jpg' | relative_url }}') center center / cover no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  @media (min-width: 1400px) {
    .hero-opossum { margin-left: -3rem; margin-right: -3rem; }
  }
  .hero-opossum::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.38);
  }
  .hero-inner {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 1rem;
  }
  .hero-inner h1 {
    margin: 0 0 1.6rem;
    color: #fff;
    font-size: clamp(2.2rem, 6vw, 5rem);
    font-weight: 800;
    letter-spacing: 0.07em;
    text-shadow: 0 3px 16px rgba(0, 0, 0, 0.65);
  }

  /* Boutons réseaux sociaux, posés sur l'image sous le titre */
  .social-opossum {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    justify-content: center;
  }
  .social-opossum a {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    padding: 0.75rem 1.6rem;
    border-radius: 999px;
    font-size: 1.05rem;
    font-weight: 600;
    color: #fff !important;
    text-decoration: none;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .social-opossum a:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
  }
  .social-opossum i { font-size: 1.35rem; }
  .social-opossum .gh { background: #24292e; }
  .social-opossum .ig {
    background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
  }
</style>

<div class="hero-opossum">
  <div class="hero-inner">
    <h1>TEAM OPOSSUM</h1>
    <div class="social-opossum">
      <a class="gh" href="https://github.com/Les-opossums" target="_blank" rel="noopener">
        <i class="fa-brands fa-github"></i> GitHub
      </a>
      <a class="ig" href="https://www.instagram.com/scrat_opossums/" target="_blank" rel="noopener">
        <i class="fa-brands fa-instagram"></i> Instagram
      </a>
    </div>
  </div>
</div>
